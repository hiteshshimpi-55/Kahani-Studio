name: Backend

on:
  push:
    branches: [feat/editor]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Compile check
        run: python -m compileall app worker routes

  build-deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Debug OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com')
            const payload = JSON.parse(
              Buffer.from(token.split('.')[1], 'base64url').toString('utf8'),
            )
            core.info(`sub=${payload.sub}`)
            core.info(`aud=${JSON.stringify(payload.aud)}`)
            core.info(`iss=${payload.iss}`)
            core.info(`repository=${payload.repository}`)

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-2' }}
          role-session-name: github-actions-kahani


      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" -f backend/Dockerfile backend
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"
          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render and deploy new task definitions
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER }}
          SERVICE_API: ${{ vars.ECS_SERVICE_API }}
          SERVICE_WORKER: ${{ vars.ECS_SERVICE_WORKER }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail

          deploy_service() {
            local service="$1"
            local td
            td=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
              --query 'services[0].taskDefinition' --output text)
            aws ecs describe-task-definition --task-definition "$td" \
              --query 'taskDefinition' > /tmp/td.json
            python3 <<'PY'
          import json, os
          image = os.environ["IMAGE"]
          with open("/tmp/td.json") as f:
              td = json.load(f)
          for key in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                      "compatibilities", "registeredAt", "registeredBy"):
              td.pop(key, None)
          for c in td.get("containerDefinitions", []):
              c["image"] = image
          with open("/tmp/td-new.json", "w") as f:
              json.dump(td, f)
          PY
            NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-new.json \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service --cluster "$CLUSTER" --service "$service" \
              --task-definition "$NEW_ARN"
          }

          deploy_service "$SERVICE_API"
          deploy_service "$SERVICE_WORKER"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE_API" "$SERVICE_WORKER"
