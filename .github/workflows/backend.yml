name: Backend

on:
  push:
    branches: [feat/editor]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Compile check
        run: python -m compileall app worker routes

  build-deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION || 'ap-south-2' }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'kahani-studio-production-api' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -z "$ECR_REPOSITORY" ]; then
            echo "ECR_REPOSITORY is empty — set the GitHub Actions variable" >&2
            exit 1
          fi
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$IMAGE_URI:$IMAGE_TAG" -t "$IMAGE_URI:latest" -f backend/Dockerfile backend
          docker push "$IMAGE_URI:$IMAGE_TAG"
          docker push "$IMAGE_URI:latest"
          echo "image=$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Render and deploy new task definitions
        env:
          CLUSTER: ${{ vars.ECS_CLUSTER || 'kahani-studio-production' }}
          SERVICE_API: ${{ vars.ECS_SERVICE_API || 'kahani-studio-production-api' }}
          SERVICE_WORKER: ${{ vars.ECS_SERVICE_WORKER || 'kahani-studio-production-worker' }}
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          set -euo pipefail

          deploy_service() {
            local service="$1"
            local td
            td=$(aws ecs describe-services --cluster "$CLUSTER" --services "$service" \
              --query 'services[0].taskDefinition' --output text)
            aws ecs describe-task-definition --task-definition "$td" \
              --query 'taskDefinition' > /tmp/td.json
            python3 <<'PY'
          import json, os
          image = os.environ["IMAGE"]
          with open("/tmp/td.json") as f:
              td = json.load(f)
          for key in ("taskDefinitionArn", "revision", "status", "requiresAttributes",
                      "compatibilities", "registeredAt", "registeredBy"):
              td.pop(key, None)
          for c in td.get("containerDefinitions", []):
              c["image"] = image
          with open("/tmp/td-new.json", "w") as f:
              json.dump(td, f)
          PY
            NEW_ARN=$(aws ecs register-task-definition --cli-input-json file:///tmp/td-new.json \
              --query 'taskDefinition.taskDefinitionArn' --output text)
            aws ecs update-service --cluster "$CLUSTER" --service "$service" \
              --task-definition "$NEW_ARN"
          }

          deploy_service "$SERVICE_API"
          deploy_service "$SERVICE_WORKER"
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE_API" "$SERVICE_WORKER"
