[project]
name = "kissa-backend"
version = "0.1.0"
description = "Kissa API and generation workers"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "redis>=5.2.0",
    "arq>=0.26.1",
    "pydantic-settings>=2.6.0",
    "httpx>=0.28.0",
    "openai>=1.50.0",
    "tavily-python>=0.5.0",
    "python-multipart>=0.0.17",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    "langchain-core>=0.3.0",
    "openai>=1.60.0",
    "anthropic>=0.40.0",
    "databricks-ai-search>=0.1.0",
    "sse-starlette>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "worker", "routes", "contentExtraction"]
