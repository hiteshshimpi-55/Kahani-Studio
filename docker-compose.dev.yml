# Hot-reload overlay for local development.
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# (or: make run)

services:
  api:
    volumes:
      - ./backend/app:/app/app
      - ./backend/worker:/app/worker
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
      ]

  worker:
    volumes:
      - ./backend/app:/app/app
      - ./backend/worker:/app/worker
    command:
      [
        "watchfiles",
        "--filter",
        "python",
        "arq worker.settings.WorkerSettings",
        "/app/app",
        "/app/worker",
      ]

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    environment:
      # Empty = same-origin; Vite proxies /api → api:8000
      VITE_API_BASE_URL: ""
      VITE_PROXY_TARGET: "http://api:8000"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    ports: !override
      - "5173:5173"
    command:
      [
        "sh",
        "-c",
        "test -d node_modules/vite || npm ci; npm run dev -- --host 0.0.0.0 --port 5173",
      ]

volumes:
  web_node_modules:
